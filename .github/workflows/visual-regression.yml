name: Update Visual Baselines

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to update baselines with'
        required: true
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]

jobs:
  update-baselines:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install ${{ github.event.inputs.browser }} --with-deps
      - run: npx playwright test tests/visual/ --update-snapshots --project=${{ github.event.inputs.browser }}
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          HEADLESS: true
      - name: Commit updated baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visual-baselines/
          git diff --staged --quiet || git commit -m "chore: update visual baselines [${{ github.event.inputs.browser }}]"
          git push
