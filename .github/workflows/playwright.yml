name: Playwright CI — Smoke

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      env:
        description: 'Test environment'
        required: false
        default: qa
        type: choice
        options: [qa, staging]

env:
  NODE_VERSION: '20.x'
  TEST_ENV: ${{ github.event.inputs.env || 'qa' }}

jobs:
  smoke:
    name: Smoke Tests — chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - run: npx playwright install chromium --with-deps

      - name: Run smoke tests
        run: npx playwright test tests/smoke/ --project=chromium
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          USERNAME: ${{ secrets.USERNAME || 'Admin' }}
          PASSWORD: ${{ secrets.PASSWORD || 'admin123' }}
          CI: true
          HEADLESS: true
          NAVIGATION_TIMEOUT: '90000'
          RETRIES: '3'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ github.run_number }}
          path: test-results/
          retention-days: 7

  notify:
    needs: smoke
    runs-on: ubuntu-latest
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          STATUS="${{ needs.smoke.result }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          curl -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{\"text\":\"$EMOJI Smoke CI | Branch: ${{ github.ref_name }} | Status: $STATUS | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Run>\"}"
