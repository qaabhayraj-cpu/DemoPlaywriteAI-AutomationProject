name: Smoke Tests — Daily 12:25 PM IST

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Run on every push to main (and PRs targeting main)
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Daily at 12:25 PM IST (06:55 UTC)
  schedule:
    - cron: '55 6 * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run smoke tests on'
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]
      env:
        description: 'Target environment'
        required: false
        default: qa
        type: choice
        options: [qa, staging]

  # Can be called by other workflows (e.g. after a deploy)
  workflow_call:
    inputs:
      browser:
        required: false
        default: chromium
        type: string
      env:
        required: false
        default: qa
        type: string

# ── Env ───────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20.x'
  BROWSER:   ${{ inputs.browser || 'chromium' }}
  TEST_ENV:  ${{ inputs.env    || 'qa' }}

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  smoke:
    name: Smoke — ${{ inputs.browser || 'chromium' }} (${{ inputs.env || 'qa' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 3. Playwright browsers (cached) ──────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.BROWSER }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ env.BROWSER }}-${{ runner.os }}-

      - name: Install Playwright browser — ${{ env.BROWSER }}
        run: npx playwright install ${{ env.BROWSER }} --with-deps

      # ── 4. Run smoke tests ───────────────────────────────────────────────────
      - name: Run smoke tests
        run: |
          npx playwright test tests/smoke/smoke.spec.ts \
            --project=${{ env.BROWSER }} \
            --reporter=list,html,junit,allure-playwright
        env:
          BASE_URL:  ${{ secrets.BASE_URL  || 'https://opensource-demo.orangehrmlive.com' }}
          USERNAME:  ${{ secrets.USERNAME  || 'Admin' }}
          PASSWORD:  ${{ secrets.PASSWORD  || 'admin123' }}
          CI:        true
          HEADLESS:  true
          TEST_ENV:  ${{ env.TEST_ENV }}

      # ── 5. Generate Allure HTML report ───────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: npm run report:allure

      # ── 6. Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report-${{ env.BROWSER }}-run${{ github.run_number }}
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report-${{ env.BROWSER }}-run${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ env.BROWSER }}-run${{ github.run_number }}
          path: test-results/
          retention-days: 14

      # ── 7. GitHub Actions job summary ────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          echo "## $EMOJI Smoke Tests — \`${{ env.BROWSER }}\` | \`${{ env.TEST_ENV }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Schedule  | Daily 12:25 PM IST (06:55 UTC) |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser   | \`${{ env.BROWSER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ env.TEST_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch    | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run #     | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status    | **${STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 Full Allure report available in the _Artifacts_ section." >> $GITHUB_STEP_SUMMARY

      # ── 8. Zip Allure report for email attachment ────────────────────────────
      - name: Zip Allure report
        if: always()
        run: |
          zip -r allure-report.zip allure-report/
          echo "📦 Allure report zipped: $(du -sh allure-report.zip | cut -f1)"

      # ── 9. Email report with Allure zip attached ──────────────────────────────
      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: qaabhayraj@gmail.com
          from: QA Automation <${{ secrets.MAIL_USERNAME }}>
          subject: "${{ job.status == 'success' && '✅' || '❌' }} Smoke Tests — ${{ env.BROWSER }} | ${{ env.TEST_ENV }} | Run #${{ github.run_number }}"
          html_body: |
            <!DOCTYPE html>
            <html>
            <body style="font-family:Arial,sans-serif;max-width:600px;margin:auto;padding:20px;color:#333;">
              <h2 style="border-bottom:2px solid ${{ job.status == 'success' && '#28a745' || '#dc3545' }};padding-bottom:10px;">
                ${{ job.status == 'success' && '✅ Smoke Tests Passed' || '❌ Smoke Tests Failed' }}
              </h2>
              <table style="width:100%;border-collapse:collapse;margin:20px 0;">
                <tr style="background:#f8f9fa;">
                  <td style="padding:10px;border:1px solid #dee2e6;font-weight:bold;">Status</td>
                  <td style="padding:10px;border:1px solid #dee2e6;color:${{ job.status == 'success' && '#28a745' || '#dc3545' }};font-weight:bold;">${{ job.status }}</td>
                </tr>
                <tr>
                  <td style="padding:10px;border:1px solid #dee2e6;font-weight:bold;">Browser</td>
                  <td style="padding:10px;border:1px solid #dee2e6;">${{ env.BROWSER }}</td>
                </tr>
                <tr style="background:#f8f9fa;">
                  <td style="padding:10px;border:1px solid #dee2e6;font-weight:bold;">Environment</td>
                  <td style="padding:10px;border:1px solid #dee2e6;">${{ env.TEST_ENV }}</td>
                </tr>
                <tr>
                  <td style="padding:10px;border:1px solid #dee2e6;font-weight:bold;">Branch</td>
                  <td style="padding:10px;border:1px solid #dee2e6;">${{ github.ref_name }}</td>
                </tr>
                <tr style="background:#f8f9fa;">
                  <td style="padding:10px;border:1px solid #dee2e6;font-weight:bold;">Run #</td>
                  <td style="padding:10px;border:1px solid #dee2e6;">${{ github.run_number }}</td>
                </tr>
                <tr>
                  <td style="padding:10px;border:1px solid #dee2e6;font-weight:bold;">Triggered by</td>
                  <td style="padding:10px;border:1px solid #dee2e6;">${{ github.event_name }}</td>
                </tr>
              </table>
              <div style="margin:20px 0;">
                <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                   style="background:#0366d6;color:#fff;padding:12px 24px;text-decoration:none;border-radius:4px;display:inline-block;font-weight:bold;">
                  📊 View Full Allure Report & Artifacts
                </a>
              </div>
              <p style="color:#6c757d;font-size:12px;margin-top:30px;border-top:1px solid #dee2e6;padding-top:10px;">
                📎 <strong>allure-report.zip</strong> is attached to this email — open index.html inside to view the full interactive report.<br/>
                This email was sent automatically by GitHub Actions · ${{ github.repository }}
              </p>
            </body>
            </html>
          attachments: allure-report.zip

      # ── 10. Slack notification (optional) ────────────────────────────────────
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \"$EMOJI *Smoke Tests* | Browser: \`${{ env.BROWSER }}\` | Env: \`${{ env.TEST_ENV }}\` | Branch: \`${{ github.ref_name }}\` | Status: *${STATUS}* | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Report>\"
            }"
