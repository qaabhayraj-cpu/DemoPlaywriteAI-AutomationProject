name: Smoke Tests — Daily 12:25 PM IST

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Run on every push to main (and PRs targeting main)
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Daily at 12:25 PM IST (06:55 UTC)
  schedule:
    - cron: '55 6 * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run smoke tests on'
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]
      env:
        description: 'Target environment'
        required: false
        default: qa
        type: choice
        options: [qa, staging]

  # Can be called by other workflows (e.g. after a deploy)
  workflow_call:
    inputs:
      browser:
        required: false
        default: chromium
        type: string
      env:
        required: false
        default: qa
        type: string

# ── Permissions (needed for GitHub Pages deployment) ──────────────────────────
permissions:
  contents: write
  pages: write
  id-token: write

# ── Env ───────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20.x'
  BROWSER:   ${{ inputs.browser || 'chromium' }}
  TEST_ENV:  ${{ inputs.env    || 'qa' }}

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  smoke:
    name: Smoke — ${{ inputs.browser || 'chromium' }} (${{ inputs.env || 'qa' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 3. Playwright browsers (cached) ──────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.BROWSER }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ env.BROWSER }}-${{ runner.os }}-

      - name: Install Playwright browser — ${{ env.BROWSER }}
        run: npx playwright install ${{ env.BROWSER }} --with-deps

      # ── 4. Run smoke tests ───────────────────────────────────────────────────
      - name: Run smoke tests
        run: |
          npx playwright test tests/smoke/smoke.spec.ts \
            --project=${{ env.BROWSER }} \
            --reporter=list,html,junit,allure-playwright
        env:
          BASE_URL:  ${{ secrets.BASE_URL  || 'https://opensource-demo.orangehrmlive.com' }}
          USERNAME:  ${{ secrets.USERNAME  || 'Admin' }}
          PASSWORD:  ${{ secrets.PASSWORD  || 'admin123' }}
          CI:        true
          HEADLESS:  true
          TEST_ENV:  ${{ env.TEST_ENV }}

      # ── 5. Generate Allure HTML report ───────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: npm run report:allure

      # ── 6. Deploy Allure report to GitHub Pages ───────────────────────────────
      # Each run gets its own URL:
      # https://qaabhayraj-cpu.github.io/DemoPlaywriteAI-AutomationProject/smoke/run-<N>/
      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-report
          destination_dir: smoke/run-${{ github.run_number }}
          keep_files: true

      # ── 7. Upload artifacts (backup) ─────────────────────────────────────────
      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report-${{ env.BROWSER }}-run${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results-${{ env.BROWSER }}-run${{ github.run_number }}
          path: test-results/
          retention-days: 14

      # ── 8. GitHub Actions job summary with clickable report URL ──────────────
      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          RUN_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          REPORT_URL="https://qaabhayraj-cpu.github.io/DemoPlaywriteAI-AutomationProject/smoke/run-${{ github.run_number }}/"

          echo "## $EMOJI Smoke Tests — \`${{ env.BROWSER }}\` | \`${{ env.TEST_ENV }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 [Open Allure Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **URL:** \`$REPORT_URL\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status      | **${STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Time    | $RUN_TIME |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser     | \`${{ env.BROWSER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ env.TEST_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch      | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run #       | ${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered   | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY

      # ── 9. Slack notification with report link (optional) ────────────────────
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          REPORT_URL="https://qaabhayraj-cpu.github.io/DemoPlaywriteAI-AutomationProject/smoke/run-${{ github.run_number }}/"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \"$EMOJI *Smoke Tests* | Browser: \`${{ env.BROWSER }}\` | Env: \`${{ env.TEST_ENV }}\` | Branch: \`${{ github.ref_name }}\` | Status: *${STATUS}* | <${REPORT_URL}|📊 Open Allure Report>\"
            }"
