name: Full Regression — Nightly 11:30 PM IST

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  # Nightly at 11:30 PM IST (18:00 UTC)
  schedule:
    - cron: '0 18 * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run regression on'
        required: false
        default: chromium
        type: choice
        options: [chromium, firefox, webkit]
      env:
        description: 'Target environment'
        required: false
        default: qa
        type: choice
        options: [qa, staging]

  # Can be called by other workflows (e.g. after smoke passes)
  workflow_call:
    inputs:
      browser:
        required: false
        default: chromium
        type: string
      env:
        required: false
        default: qa
        type: string

# ── Env ───────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20.x'
  BROWSER:   ${{ inputs.browser || 'chromium' }}
  TEST_ENV:  ${{ inputs.env    || 'qa' }}

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  full-regression:
    name: Regression — ${{ inputs.browser || 'chromium' }} (${{ inputs.env || 'qa' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 3. Playwright browsers (cached) ──────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ env.BROWSER }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ env.BROWSER }}-${{ runner.os }}-

      - name: Install Playwright browser — ${{ env.BROWSER }}
        run: npx playwright install ${{ env.BROWSER }} --with-deps

      # ── 4. Run regression tests ───────────────────────────────────────────────
      - name: Run regression tests
        run: |
          npx playwright test \
            --project=regression-${{ env.BROWSER }} \
            --grep-invert @canary \
            --reporter=list,html,junit,allure-playwright
        env:
          BASE_URL:  ${{ secrets.BASE_URL  || 'https://opensource-demo.orangehrmlive.com' }}
          USERNAME:  ${{ secrets.USERNAME  || 'Admin' }}
          PASSWORD:  ${{ secrets.PASSWORD  || 'admin123' }}
          CI:        true
          HEADLESS:  true
          TEST_ENV:  ${{ env.TEST_ENV }}

      # ── 5. Generate Allure HTML report ───────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: npm run report:allure

      # ── 6. Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-report-${{ env.BROWSER }}-run${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-results-${{ env.BROWSER }}-run${{ github.run_number }}
          path: test-results/
          retention-days: 14

      # ── 7. GitHub Actions job summary ────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          RUN_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "## $EMOJI Full Regression — \`${{ env.BROWSER }}\` | \`${{ env.TEST_ENV }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 [Open Run & Download Allure Report]($RUN_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status      | **${STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Time    | \`$RUN_TIME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Browser     | \`${{ env.BROWSER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ env.TEST_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch      | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run #       | \`${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered   | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 Download **Allure Report** from the _Artifacts_ section of the run above." >> $GITHUB_STEP_SUMMARY

      # ── 8. Slack notification (optional) ─────────────────────────────────────
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \"$EMOJI *Full Regression* | Browser: \`${{ env.BROWSER }}\` | Env: \`${{ env.TEST_ENV }}\` | Branch: \`${{ github.ref_name }}\` | Status: *${STATUS}* | <${RUN_URL}|📊 View Run & Allure Report>\"
            }"
