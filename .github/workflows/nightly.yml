name: Nightly Full Regression

on:
  # Run on every push to main (not PRs — full regression is too heavy for every branch)
  push:
    branches: [main]

  # Nightly at 01:00 UTC (06:30 IST)
  schedule:
    - cron: '0 1 * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch: {}

  # Can be called by other workflows (e.g. after smoke passes)
  workflow_call: {}

jobs:
  full-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: |
          npx playwright test --grep @regression
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          USERNAME: ${{ secrets.USERNAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          CI: true
          HEADLESS: true
          TEST_ENV: qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightly-results
          path: |
            test-results/
            allure-results/
          retention-days: 14
