name: Playwright Performance Tests

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - 'tests/performance/**'
      - 'src/**'
      - 'playwright.config.ts'

  # Daily at 3:00 AM IST (21:30 UTC previous day)
  schedule:
    - cron: '30 21 * * *'

  # Manual trigger from GitHub Actions UI
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        required: false
        default: qa
        type: choice
        options: [qa, staging]

# ── Env ───────────────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20.x'
  TEST_ENV: ${{ inputs.env || 'qa' }}

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  playwright-performance:
    name: Playwright Performance — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── 3. Playwright Chromium (cached) ───────────────────────────────────────
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # ── 4. Run Playwright performance tests ───────────────────────────────────
      - name: Run performance tests
        run: |
          npx playwright test tests/performance/ \
            --project=performance-chromium \
            --reporter=list,html,junit,allure-playwright
        env:
          BASE_URL:           ${{ secrets.BASE_URL || 'https://opensource-demo.orangehrmlive.com' }}
          USERNAME:           ${{ secrets.USERNAME || 'Admin' }}
          PASSWORD:           ${{ secrets.PASSWORD || 'admin123' }}
          CI:                 true
          HEADLESS:           true
          TEST_ENV:           ${{ env.TEST_ENV }}
          NAVIGATION_TIMEOUT: '90000'
          RETRIES:            '2'

      # ── 5. Generate Allure report ─────────────────────────────────────────────
      - name: Generate Allure report
        if: always()
        run: npm run report:allure

      # Bundle a one-click local-server launcher into the report itself, and inject
      # a warning that fires if index.html is still opened directly — opening it
      # always fails (Allure loads data via fetch(), which browsers block on
      # file://) — see scripts/report-launcher/README.txt
      - name: Add report launcher
        if: always()
        run: |
          if [ -d allure-report ]; then
            cp scripts/report-launcher/OPEN-REPORT.command scripts/report-launcher/OPEN-REPORT.bat scripts/report-launcher/README.txt allure-report/
            chmod +x allure-report/OPEN-REPORT.command
            python3 scripts/inject-report-warning.py allure-report/index.html
          fi

      # ── 6. Upload artifacts ───────────────────────────────────────────────────
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-playwright-allure-run${{ github.run_number }}
          path: allure-report/
          retention-days: 14

      - name: Upload raw test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-playwright-results-run${{ github.run_number }}
          path: test-results/
          retention-days: 14

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-playwright-junit-run${{ github.run_number }}
          path: test-results/junit.xml
          retention-days: 14

      # ── 7. GitHub Actions job summary ─────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          RUN_TIME=$(date '+%Y-%m-%d %H:%M:%S UTC')
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          echo "## $EMOJI Playwright Performance Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 [Open Run & Download Allure Report]($RUN_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter   | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status      | **${STATUS}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Time    | \`$RUN_TIME\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Project     | \`performance-chromium\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | \`${{ env.TEST_ENV }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch      | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Run #       | \`${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered   | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📎 Download **Allure Report** from the _Artifacts_ section above." >> $GITHUB_STEP_SUMMARY

      # ── 8. Slack notification (optional) ─────────────────────────────────────
      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          STATUS="${{ job.status }}"
          EMOJI=$([[ "$STATUS" == "success" ]] && echo "✅" || echo "❌")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H 'Content-type: application/json' \
            -d "{
              \"text\": \"$EMOJI *Playwright Performance* | Branch: \`${{ github.ref_name }}\` | Env: \`${{ env.TEST_ENV }}\` | Status: *${STATUS}* | <${RUN_URL}|📊 View Run & Allure Report>\"
            }"
